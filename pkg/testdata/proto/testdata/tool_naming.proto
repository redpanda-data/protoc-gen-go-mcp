syntax = "proto3";

package testdata;

import "mcp/v1/annotations.proto";

message ToolNamingRequest {
  string id = 1;
}

message ToolNamingResponse {
  string result = 1;
}

// ToolNamingService pins the three tool-naming behaviors in golden
// output: a configured (mcp.v1.tool_name), a plain derived name, and a
// derived name long enough to be hash-truncated with a provider-safe
// leading character.
service ToolNamingService {
  // Configured: emitted exactly as authored, no service prefix.
  rpc GetDashboard(ToolNamingRequest) returns (ToolNamingResponse) {
    option (mcp.v1.tool_name) = "get_dashboard";
  }

  // Derived: full proto path with underscores, unchanged behavior.
  rpc GetWidget(ToolNamingRequest) returns (ToolNamingResponse) {}

  // Derived + mangled: exceeds 64 chars, so the emitted name is the
  // hash-truncated form whose first character is always a letter.
  rpc GetEquityResearchReportForInstitutionalAndRetailClients(ToolNamingRequest) returns (ToolNamingResponse) {}
}
