version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/redpanda-data/protoc-gen-go-mcp/pkg/testdata/gen/go
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    # The vendored annotations proto must keep its real go_package
    # (pkg/mcpv1) so generated testdata code never registers a second
    # copy of mcp/v1/annotations.proto; its Go output is deleted after
    # generation (see justfile).
    - file_option: go_package
      path: mcp/v1/annotations.proto
inputs:
  - directory: proto
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ./gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: ./gen/go
    opt:
    - paths=source_relative
  - remote: buf.build/connectrpc/go:v1.18.1
    out: ./gen/go
    opt:
    - paths=source_relative
  - local: ["go","run","../../cmd/protoc-gen-go-mcp"]
    out: ./gen/go
    opt:
      - paths=source_relative
